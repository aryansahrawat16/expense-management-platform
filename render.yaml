# Render Blueprint: creates the database, API and website in one step.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: expense-db
    plan: free
    databaseName: expense_db
    user: expense_user

services:
  - type: web
    name: expense-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # set to the website URL, e.g. https://expense-web.onrender.com
      - key: AI_API_KEY
        sync: false  # optional, enables receipt scanning

  - type: web
    name: expense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # set to the API URL, e.g. https://expense-api.onrender.com
